<VirtualHost *:80>
    ServerName oa.local
    DocumentRoot /var/www/html/oa-system/backend/public

    <Directory /var/www/html/oa-system/backend/public>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /app /var/www/html/oa-system/frontend
    <Directory /var/www/html/oa-system/frontend>
        AllowOverride None
        Require all granted
    </Directory>

    Alias /uploads /var/www/html/oa-system/backend/storage/uploads
    <Directory /var/www/html/oa-system/backend/storage/uploads>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/oa-error.log
    CustomLog ${APACHE_LOG_DIR}/oa-access.log combined
</VirtualHost>
