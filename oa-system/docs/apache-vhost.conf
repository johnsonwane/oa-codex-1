<VirtualHost *:443>
    ServerName oac.hahahaxinli.com

    SSLEngine on
    SSLCertificateFile /opt/cert/oac.hahahaxinli.com.crt
    SSLCertificateKeyFile /opt/cert/oac.hahahaxinli.com.key
    SSLCertificateChainFile /opt/cert/root_bundle.crt

    # 前端静态文件放在域名根目录
    DocumentRoot /opt/webapps/oac.hahahaxinli.com/frontend
    <Directory /opt/webapps/oac.hahahaxinli.com/frontend>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # 后端 API 统一挂载在 /api
    Alias /api /opt/webapps/oac.hahahaxinli.com/backend/public
    <Directory /opt/webapps/oac.hahahaxinli.com/backend/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 上传文件
    Alias /uploads /opt/webapps/oac.hahahaxinli.com/backend/storage/uploads
    <Directory /opt/webapps/oac.hahahaxinli.com/backend/storage/uploads>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/oac-error.log
    CustomLog ${APACHE_LOG_DIR}/oac-access.log combined
</VirtualHost>
